background            #1e1e2e
foreground            #cdd6f4

# Smooth beam caret: Kitty's native trail gives the caret a small violet echo.
cursor                #cdd6f4
cursor_text_color     #1e1e2e
cursor_shape          beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail          8
cursor_trail_decay    0.06 0.20
cursor_trail_start_threshold 1
cursor_trail_color    #cba6f7

# Transparent terminal panel; Hyprland supplies the outer glass layer.
background_opacity    0.93
dynamic_background_opacity yes

# Tab and pane chrome
active_tab_foreground   #1e1e2e
active_tab_background   #cba6f7
inactive_tab_foreground #9aa1b7
inactive_tab_background #353543
tab_bar_background      #171723
active_border_color     #cba6f7
inactive_border_color   #45475a
bell_border_color       #f38ba8
window_border_width     1pt
window_margin_width     0
inactive_text_alpha     0.78

# black
color0  #1e1e2e
color8  #45475a

# red
color1  #f38ba8
color9  #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #cba6f7
color13 #cba6f7

#cyan
color6  #94e2d5
color14 #94e2d5

