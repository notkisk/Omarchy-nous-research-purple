background            #06040b
foreground            #ded7e8

# Smooth beam caret with a restrained research-violet trail.
cursor                #ded7e8
cursor_text_color     #06040b
cursor_shape          beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail          8
cursor_trail_decay    0.06 0.20
cursor_trail_start_threshold 1
cursor_trail_color    #a746e8

# Use the original base theme's near-black surface, fully opaque.
background_opacity    1.0
dynamic_background_opacity no

# black
color0  #090611
color8  #342346

# red
color1  #e06ba8
color9  #e06ba8

# green
color2  #a99acb
color10 #a99acb

