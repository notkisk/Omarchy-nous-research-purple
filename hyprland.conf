# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(89b4fa) rgb(cba6f7) rgb(89b4fa) 45deg
$inactiveBorderColor = rgba(45475a99)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 8
    gaps_out = 14
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 3
    rounding_power = 2
    active_opacity = 0.94
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(cba6f726)
        color_inactive = rgba(0f0f17aa)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        special = true
        new_optimizations = true
        brightness = 0.78
        contrast = 0.90
    }
}

animations {
    bezier = nousPulse, 0.22, 1, 0.36, 1
    bezier = nousSnap, 0.16, 0.84, 0.26, 1
    bezier = nousLinear, 0, 0, 1, 1

    # The gradient rotates slowly on focus, like an instrument coming online.
    animation = border, 1, 5.5, nousPulse
    animation = borderangle, 1, 8, nousPulse
    animation = windows, 1, 4.2, nousSnap
    animation = windowsIn, 1, 3.8, nousSnap, popin 82%
    animation = windowsOut, 1, 2.4, nousLinear, popin 82%
    animation = fade, 1, 3.4, nousPulse
    animation = workspaces, 1, 3.8, nousPulse
}
