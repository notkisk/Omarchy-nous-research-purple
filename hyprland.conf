# Nous Research — instrument glass compositor layer.
# Included by Omarchy after its defaults.

$activeBorderColor = rgb(9563da) rgb(a746e8) rgb(9563da) 45deg
$inactiveBorderColor = rgba(342346aa)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 7
    gaps_out = 12
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.94
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(a746e82e)
        color_inactive = rgba(06040baa)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        special = true
        new_optimizations = true
        brightness = 0.78
        contrast = 0.90
    }
}

animations {
    bezier = nousPulse, 0.22, 1, 0.36, 1
    bezier = nousSnap, 0.16, 0.84, 0.26, 1
    bezier = nousLinear, 0, 0, 1, 1

    animation = border, 1, 5.5, nousPulse
    animation = borderangle, 1, 8, nousPulse
    animation = windows, 1, 4.2, nousSnap
    animation = windowsIn, 1, 3.8, nousSnap, popin 82%
    animation = windowsOut, 1, 2.4, nousLinear, popin 82%
    animation = fade, 1, 3.4, nousPulse
    animation = workspaces, 1, 3.8, nousPulse
}
