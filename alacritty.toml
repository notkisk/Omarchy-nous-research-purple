[colors]
[colors.primary]
background = "#0f0f17"
foreground = "#cdd6f4"

[colors.normal]
black   = "#1e1e2e"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#cdd6f4"

[colors.bright]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#cba6f7"
cyan    = "#94e2d5"
white   = "#ffffff"

[colors.cursor]
text   = "#0f0f17"
cursor = "#cdd6f4"

[window]
opacity = 1.0

# Thin animated beam caret; Alacritty keeps this deliberately clean.
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 550
blink_timeout = 0
thickness = 0.15
unfocused_hollow = true
