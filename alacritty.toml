[colors]
[colors.primary]
background = "#06040b"
foreground = "#ded7e8"

[colors.normal]
black   = "#090611"
red     = "#e06ba8"
green   = "#a99acb"
yellow  = "#d9c979"
blue    = "#9563da"
magenta = "#a746e8"
cyan    = "#bd9eea"
white   = "#ded7e8"

[colors.bright]
black   = "#342346"
red     = "#e06ba8"
green   = "#a99acb"
yellow  = "#d9c979"
blue    = "#9563da"
magenta = "#a746e8"
cyan    = "#bd9eea"
white   = "#ffffff"

[colors.cursor]
text   = "#06040b"
cursor = "#ded7e8"

[window]
opacity = 1.0

# Thin animated beam caret; Alacritty keeps this deliberately clean.
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 550
blink_timeout = 0
thickness = 0.15
unfocused_hollow = true
